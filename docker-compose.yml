services:
  db:
    image: postgres:17-alpine
    container_name: daw-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daw}
      POSTGRES_USER: ${POSTGRES_USER:-daw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-REMOVED-SECRET}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - daw-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-daw} -d ${POSTGRES_DB:-daw}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  blazorapp:
    build: .
    container_name: blazorapp
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=${ASPNETCORE_FORWARDEDHEADERS_ENABLED}
      - DisableHttpsRedirection=${DISABLE_HTTPS_REDIRECTION}
      - ConnectionStrings__Default=Host=db;Port=5432;Database=${POSTGRES_DB:-daw};Username=${POSTGRES_USER:-daw};Password=${POSTGRES_PASSWORD:-REMOVED-SECRET}
      - Storage__RootPath=/app/uploads
    volumes:
      - daw-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: blazor-nginx
    ports:
      - "${NGINX_HTTP_PORT}:80"
    environment:
      - UPSTREAM=${UPSTREAM}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - blazorapp
    restart: unless-stopped

volumes:
  daw-postgres-data:
  daw-uploads:
