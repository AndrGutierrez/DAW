services:
  db:
    image: postgres:15-alpine
    container_name: daw-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - daw-postgres15-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  blazorapp:
    build: .
    container_name: blazorapp
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=${ASPNETCORE_FORWARDEDHEADERS_ENABLED}
      - DisableHttpsRedirection=${DISABLE_HTTPS_REDIRECTION}
      - ConnectionStrings__Default=Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Seed__AdminUsername=${SEED_ADMIN_USERNAME}
      - Seed__AdminEmail=${SEED_ADMIN_EMAIL}
      - Seed__AdminPassword=${SEED_ADMIN_PASSWORD}
      - Seed__EmployeeUsername=${SEED_EMPLOYEE_USERNAME:-employee}
      - Seed__EmployeeEmail=${SEED_EMPLOYEE_EMAIL:-employee@daw.local}
      - Seed__EmployeePassword=${SEED_EMPLOYEE_PASSWORD:-}
      - Storage__RootPath=/app/uploads
    volumes:
      - daw-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: blazor-nginx
    ports:
      - "${NGINX_HTTP_PORT}:80"
    environment:
      - UPSTREAM=${UPSTREAM}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./db/erd:/usr/share/nginx/html/erd:ro
    depends_on:
      - blazorapp
    restart: unless-stopped

volumes:
  daw-postgres15-data:
  daw-uploads:
