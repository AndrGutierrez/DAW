# Host-level reverse proxy for the DAW stack.
#
# The EC2 instance already runs a system nginx (Ubuntu package) that owns
# ports 80/443 for another site (cs.andresgutierrez.me). The DAW containers
# are therefore published on 127.0.0.1:8080, and this server block exposes
# them on port 80.
#
# Install on the instance:
#   sudo cp nginx/host-daw.conf /etc/nginx/sites-available/daw
#   sudo ln -sf /etc/nginx/sites-available/daw /etc/nginx/sites-enabled/daw
#   sudo nginx -t && sudo systemctl reload nginx
#
# CloudFront (daw.andresgutierez.me) uses this host as an HTTP origin on
# port 80 and should forward `CloudFront-Forwarded-Proto` (managed origin
# request policy `Managed-AllViewerAndCloudFrontHeaders-2022-06`). TLS is
# terminated at the edge, so if the header is missing we default to `https`
# rather than letting the API see `http` and reject the session.

map $http_cloudfront_forwarded_proto $daw_forwarded_proto {
    default $http_cloudfront_forwarded_proto;
    ''      https;
}

map $http_upgrade $connection_upgrade_daw {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name daw.andresgutierez.me _;

    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $daw_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_daw;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
