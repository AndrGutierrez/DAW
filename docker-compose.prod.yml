# Production stack for EC2 (ARM64): pulls immutable images from Amazon ECR.
# No build context and no source tree required on the host.
#
# Run from /opt/daw/current with:
#   docker compose --env-file /opt/daw/.env --env-file image.env \
#     -f docker-compose.prod.yml up -d
#
# /opt/daw/.env holds the persistent secrets (POSTGRES_*, JWT_KEY, SEED_*).
# image.env is regenerated by GitHub Actions on every deploy and defines
# API_IMAGE, NGINX_IMAGE, ECR_REGISTRY and AWS_REGION.

services:
  db:
    image: postgres:15-alpine
    container_name: daw-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - daw-postgres15-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  blazorapp:
    image: ${API_IMAGE:?API_IMAGE is required}
    container_name: blazorapp
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "./Presentation.API", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    environment: &api-environment
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=false
      - ReverseProxy__KnownProxies__0=${TRUSTED_PROXY_IP:-}
      - BcvSync__Enabled=${BCV_AUTO_SYNC:-true}
      - DisableHttpsRedirection=true
      - ConnectionStrings__Default=Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Seed__AdminUsername=${SEED_ADMIN_USERNAME}
      - Seed__AdminEmail=${SEED_ADMIN_EMAIL}
      - Seed__AdminPassword=${SEED_ADMIN_PASSWORD}
      - Seed__EmployeeUsername=${SEED_EMPLOYEE_USERNAME:-employee}
      - Seed__EmployeeEmail=${SEED_EMPLOYEE_EMAIL:-employee@daw.local}
      - Seed__EmployeePassword=${SEED_EMPLOYEE_PASSWORD:-}
      - Seed__DemoPassword=${SEED_DEMO_PASSWORD:-}
      - Storage__RootPath=/app/uploads
    volumes:
      - daw-uploads:/app/uploads
    depends_on:
      initialize:
        condition: service_completed_successfully
    restart: unless-stopped

  initialize:
    image: ${API_IMAGE:?API_IMAGE is required}
    container_name: daw-initialize
    command: ["--seed"]
    environment: *api-environment
    volumes:
      - daw-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  nginx:
    image: ${NGINX_IMAGE:?NGINX_IMAGE is required}
    container_name: blazor-nginx
    ports:
      - "80:80"
    environment:
      - UPSTREAM=${UPSTREAM:-blazorapp:8080}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      blazorapp:
        condition: service_healthy
    restart: unless-stopped

volumes:
  daw-postgres15-data:
  daw-uploads:
