name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-tests:
    name: Backend tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore DAW.slnx
      - run: dotnet test DAW.slnx --no-restore -c Release --collect:"XPlat Code Coverage" --logger trx --results-directory artifacts/backend-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: artifacts/backend-tests
  frontend-tests:
    name: SPA build and component coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: src/frontend/coverage
  stack-tests:
    name: PostgreSQL 15, browser and HTTP contracts
    runs-on: ubuntu-latest
    needs: [unit-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configure disposable stack
        shell: bash
        run: |
          set -euo pipefail
          admin_password="$(openssl rand -base64 24)Aa1!"
          employee_password="$(openssl rand -base64 24)Aa1!"
          echo "::add-mask::$admin_password"
          echo "::add-mask::$employee_password"
          cp .env.example .env
          cat >> .env <<EOF
          COMPOSE_PROJECT_NAME=daw-ci
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          JWT_KEY=$(openssl rand -hex 48)
          SEED_ADMIN_PASSWORD=$admin_password
          SEED_EMPLOYEE_PASSWORD=$employee_password
          BCV_AUTO_SYNC=false
          NGINX_HTTP_PORT=18086
          API_HTTP_PORT=5000
          EOF
          echo "E2E_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          echo "E2E_EMPLOYEE_PASSWORD=$employee_password" >> "$GITHUB_ENV"
      - name: Build and start healthy stack
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Enforce image budget
        run: |
          bash scripts/tests/verify-image-size.test.sh
          bash scripts/verify-image-size.sh daw-ci-api daw-ci-nginx
      - name: HTTP contracts
        run: |
          npx --yes newman run postman/Cattle-Management.postman_collection.json \
            -e postman/Daw.postman_environment.json \
            --env-var baseUrl=http://127.0.0.1:5000 \
            --env-var adminPassword="$E2E_ADMIN_PASSWORD"
      - name: Browser regression
        working-directory: src/frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:18086
          E2E_ADMIN_USERNAME: admin
          E2E_EMPLOYEE_USERNAME: employee
          E2E_ISOLATED_DATABASE: '1'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Preserve sanitized diagnostics
        if: failure()
        run: docker compose ps -a
      - name: Stop disposable stack
        if: always()
        run: docker compose down -v
  delivery:
    name: Publish verified artifacts
    runs-on: ubuntu-latest
    needs: [unit-tests, frontend-tests, stack-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: dotnet publish src/Presentation.API/Presentation.API.csproj -c Release -o artifacts/backend
      - working-directory: src/frontend
        run: npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: verified-backend
          path: artifacts/backend
      - uses: actions/upload-artifact@v4
        with:
          name: verified-frontend
          path: src/frontend/dist
  deploy:
    name: Deploy to AWS (ARM CodeBuild + SSM)
    runs-on: ubuntu-latest
    # Only deploy after the tests and the verified-artifact build succeed, and
    # only for pushes to main.
    needs: [unit-tests, frontend-tests, stack-tests, delivery]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      CODEBUILD_PROJECT: ${{ vars.CODEBUILD_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Build ARM64 images and roll out via CodeBuild
        shell: bash
        run: |
          set -euo pipefail
          build_id="$(aws codebuild start-build \
            --project-name "$CODEBUILD_PROJECT" \
            --source-version "$GITHUB_SHA" \
            --environment-variables-override \
              "name=IMAGE_TAG,value=$GITHUB_SHA,type=PLAINTEXT" \
            --query 'build.id' --output text)"
          echo "CodeBuild started: $build_id"
          status="IN_PROGRESS"
          for _ in $(seq 1 180); do
            status="$(aws codebuild batch-get-builds --ids "$build_id" \
              --query 'builds[0].buildStatus' --output text)"
            echo "CodeBuild status: $status"
            if [ "$status" = "SUCCEEDED" ]; then
              break
            fi
            if [ "$status" != "IN_PROGRESS" ]; then
              echo "CodeBuild failed with status $status" >&2
              exit 1
            fi
            sleep 10
          done
          if [ "$status" != "SUCCEEDED" ]; then
            echo "CodeBuild did not succeed in time" >&2
            exit 1
          fi
